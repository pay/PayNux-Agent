name: Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject missing signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then missing+=("ANDROID_KEYSTORE_BASE64"); fi
          if [ -z "${ANDROID_STORE_PASSWORD:-}" ]; then missing+=("ANDROID_STORE_PASSWORD"); fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then missing+=("ANDROID_KEY_ALIAS"); fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then missing+=("ANDROID_KEY_PASSWORD"); fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}. Configure them in Settings > Secrets and variables > Actions. No debug-signing fallback is allowed."
            exit 1
          fi
          echo "All required signing secrets are present."

      - name: Verify release version metadata
        shell: bash
        run: |
          cd flutter_app
          grep -q '^version: 1.1.0+3' pubspec.yaml || { echo "::error::pubspec.yaml must be 1.1.0+3"; exit 1; }
          grep -q "static const String version = '1.1.0';" lib/constants.dart || { echo "::error::AppConstants.version must be 1.1.0"; exit 1; }
          grep -q 'applicationId = "com.pocketdev.paynuxagent"' android/app/build.gradle || { echo "::error::applicationId mismatch"; exit 1; }
          grep -q 'flutterVersionCode = "3"' android/app/build.gradle || { echo "::error::versionCode fallback must be 3"; exit 1; }
          grep -q 'flutterVersionName = "1.1.0"' android/app/build.gradle || { echo "::error::versionName fallback must be 1.1.0"; exit 1; }
          echo "Version metadata verified: 1.1.0 (3), com.pocketdev.paynuxagent."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Decode keystore into runner temp
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/paynux-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "Keystore decoded and alias verified."

      - name: Write local key.properties (runner only)
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/paynux-release.jks"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore missing; refusing to build with debug signing."
            exit 1
          fi
          cat > flutter_app/android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 flutter_app/android/key.properties
          echo "key.properties written for this runner only."

      - name: Build release APK
        shell: bash
        run: flutter build apk --release
        working-directory: flutter_app

      - name: Verify APK signature and reject debug signing
        shell: bash
        run: |
          set -euo pipefail
          APK="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found at $APK"
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is not set."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-verify.txt
          if grep -qi 'Android Debug' apksigner-verify.txt; then
            echo "::error::APK is debug-signed. Release signing is required."
            exit 1
          fi
          echo "APK signature verified and is not debug-signed."

      - name: Compute SHA-256
        shell: bash
        run: sha256sum flutter_app/build/app/outputs/flutter-apk/app-release.apk | tee apk-sha256.txt

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: paynux-agent-v1.1.0-release-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            apksigner-verify.txt
            apk-sha256.txt
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/paynux-release.jks"
          rm -f flutter_app/android/key.properties
