name: Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject missing signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          ANDROID_OLD_STORE_PASSWORD: ${{ secrets.ANDROID_OLD_STORE_PASSWORD }}
          ANDROID_OLD_KEY_PASSWORD: ${{ secrets.ANDROID_OLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_STORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_OLD_KEYSTORE_BASE64 \
            ANDROID_OLD_STORE_PASSWORD \
            ANDROID_OLD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          echo "All seven signing secrets are present."

      - name: Verify release version metadata
        shell: bash
        run: |
          set -euo pipefail
          cd flutter_app
          grep -q '^version: 1.1.0+3' pubspec.yaml
          grep -q "static const String version = '1.1.0';" lib/constants.dart
          grep -q 'applicationId = "com.pocketdev.paynuxagent"' android/app/build.gradle
          grep -q 'flutterVersionCode = "3"' android/app/build.gradle
          grep -q 'flutterVersionName = "1.1.0"' android/app/build.gradle
          echo "Version metadata verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Prepare signing keys and certificate lineage
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          ANDROID_OLD_STORE_PASSWORD: ${{ secrets.ANDROID_OLD_STORE_PASSWORD }}
          ANDROID_OLD_KEY_PASSWORD: ${{ secrets.ANDROID_OLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          OLD_KEYSTORE="$RUNNER_TEMP/paynux-old-debug.jks"
          NEW_KEYSTORE="$RUNNER_TEMP/paynux-release.jks"
          LINEAGE="$RUNNER_TEMP/paynux-lineage.bin"

          printf '%s' "$ANDROID_OLD_KEYSTORE_BASE64" | base64 --decode > "$OLD_KEYSTORE"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$NEW_KEYSTORE"
          chmod 600 "$OLD_KEYSTORE" "$NEW_KEYSTORE"

          test -s "$OLD_KEYSTORE"
          test -s "$NEW_KEYSTORE"

          keytool -list -keystore "$OLD_KEYSTORE" \
            -storepass:env ANDROID_OLD_STORE_PASSWORD \
            -alias androiddebugkey > /dev/null

          keytool -list -keystore "$NEW_KEYSTORE" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          "$APKSIGNER" rotate \
            --out "$LINEAGE" \
            --old-signer \
            --ks "$OLD_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass env:ANDROID_OLD_STORE_PASSWORD \
            --key-pass env:ANDROID_OLD_KEY_PASSWORD \
            --set-installed-data true \
            --new-signer \
            --ks "$NEW_KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD

          test -s "$LINEAGE"
          chmod 600 "$LINEAGE"
          echo "Both keystores verified; certificate lineage created."

      - name: Write local key.properties (runner only)
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > flutter_app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/paynux-release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 flutter_app/android/key.properties

      - name: Build release APK
        shell: bash
        run: flutter build apk --release
        working-directory: flutter_app

      - name: Sign APK with certificate lineage
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_OLD_STORE_PASSWORD: ${{ secrets.ANDROID_OLD_STORE_PASSWORD }}
          ANDROID_OLD_KEY_PASSWORD: ${{ secrets.ANDROID_OLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          ROTATED_APK="$RUNNER_TEMP/app-release-lineage.apk"

          test -s "$APK"
          test -s "$RUNNER_TEMP/paynux-lineage.bin"

          "$APKSIGNER" sign \
            --out "$ROTATED_APK" \
            --ks "$RUNNER_TEMP/paynux-old-debug.jks" \
            --ks-key-alias androiddebugkey \
            --ks-pass env:ANDROID_OLD_STORE_PASSWORD \
            --key-pass env:ANDROID_OLD_KEY_PASSWORD \
            --next-signer \
            --ks "$RUNNER_TEMP/paynux-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --lineage "$RUNNER_TEMP/paynux-lineage.bin" \
            --rotation-min-sdk-version 33 \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "$APK"

          test -s "$ROTATED_APK"
          mv "$ROTATED_APK" "$APK"
          echo "APK signed with old/new certificate lineage."

      - name: Verify both certificate generations
        shell: bash
        run: |
          set -euo pipefail

          APK="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          LINEAGE="$RUNNER_TEMP/paynux-lineage.bin"
          OLD_CERT="71a2e96ed22ae7ea51ec9003322f77fc37176b015927fdafdf37250ecbfc549d"
          NEW_CERT="48e685fac5dddc0979d688972b916da8a3ad4da603470332e44321c96241bfdb"

          "$APKSIGNER" verify --verbose --print-certs \
            --min-sdk-version 33 "$APK" > apksigner-api33.txt

          "$APKSIGNER" verify --verbose --print-certs \
            --max-sdk-version 32 "$APK" > apksigner-api29-32.txt

          "$APKSIGNER" lineage --in "$LINEAGE" --print-certs \
            > lineage-verify.txt

          cat apksigner-api33.txt apksigner-api29-32.txt lineage-verify.txt \
            | tee apksigner-verify.txt

          tr -d ':[:space:]' < apksigner-api33.txt | tr '[:upper:]' '[:lower:]' \
            | grep -F "$NEW_CERT" > /dev/null || {
              echo "::error::API 33+ does not use the expected release certificate."
              exit 1
            }

          tr -d ':[:space:]' < apksigner-api29-32.txt | tr '[:upper:]' '[:lower:]' \
            | grep -F "$OLD_CERT" > /dev/null || {
              echo "::error::API 29–32 does not use the expected legacy certificate."
              exit 1
            }

          tr -d ':[:space:]' < lineage-verify.txt | tr '[:upper:]' '[:lower:]' \
            | grep -F "$OLD_CERT" > /dev/null
          tr -d ':[:space:]' < lineage-verify.txt | tr '[:upper:]' '[:lower:]' \
            | grep -F "$NEW_CERT" > /dev/null

          echo "Certificate verification passed for API 29–32 and API 33+."

      - name: Compute SHA-256
        shell: bash
        run: |
          sha256sum flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            | tee apk-sha256.txt

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: paynux-agent-v1.1.0-release-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            apksigner-verify.txt
            apksigner-api33.txt
            apksigner-api29-32.txt
            lineage-verify.txt
            apk-sha256.txt
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/paynux-old-debug.jks"
          rm -f "$RUNNER_TEMP/paynux-release.jks"
          rm -f "$RUNNER_TEMP/paynux-lineage.bin"
          rm -f "$RUNNER_TEMP/app-release-lineage.apk"
          rm -f flutter_app/android/key.properties
